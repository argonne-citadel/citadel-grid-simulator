---
name: grid-simulator-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - bandit=1.9
  # Switched from black to ruff format 2026-05-26 to match the
  # ztcard-stack supermodule lint toolchain; both tools format slightly
  # differently on multiline annotations and trailing-comment placement,
  # which fought each other once the supermodule started linting these
  # files via the SRC_DIRS extension landed in ztcard-stack !124.
  - ruff=0.13
  - cachecontrol-with-filecache=0.14
  - mypy=1.19
  - pip-audit=2.10
  - pytest=9.0
  - pytest-asyncio=1.3
  - pytest-cov=7.1
  - pytest-mock=3.15
  - twine=6.2
  - pip=26.0
  - pip:
    - build~=1.4.2